<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Product Details | Rezell</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<style>

.product-page{

width:90%;
max-width:1200px;

margin:60px auto;

display:grid;

grid-template-columns:1fr 1fr;

gap:60px;

align-items:start;

}

.product-page img{

width:100%;

border-radius:20px;

box-shadow:0 15px 35px rgba(0,0,0,.1);

}

.product-info h1{

font-size:42px;

margin-bottom:10px;

}

.rating{

font-size:22px;

margin:15px 0;

color:#ff9800;

}

.price{

font-size:36px;

font-weight:bold;

color:#e53935;

margin-bottom:20px;

}

.stock{

display:inline-block;

padding:8px 18px;

background:#dff8df;

border-radius:30px;

margin-bottom:25px;

font-weight:600;

}

.product-info p{

line-height:1.8;

color:#555;

margin-bottom:30px;

}

.product-info h3{

margin-top:25px;

margin-bottom:15px;

}

.product-info ul{

padding-left:20px;

}

.product-info li{

margin-bottom:10px;

}

.spec-table{

width:100%;

border-collapse:collapse;

margin-top:20px;

}

.spec-table td{

padding:12px;

border-bottom:1px solid #ddd;

}

.buttons{

display:flex;

gap:20px;

margin-top:35px;

}

.buttons button{

padding:15px 30px;

border:none;

border-radius:10px;

cursor:pointer;

font-size:16px;

font-weight:600;

}

.buy{

background:#00b894;

color:white;

}

.back{

background:#6c3df4;

color:white;

}

.related{

width:90%;
max-width:1200px;

margin:80px auto;

}

.related h2{

margin-bottom:30px;

}

.related-grid{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

gap:30px;

}

.related-card{

background:white;

border-radius:15px;

overflow:hidden;

box-shadow:0 10px 25px rgba(0,0,0,.08);

cursor:pointer;

transition:.3s;

}

.related-card:hover{

transform:translateY(-8px);

}

.related-card img{

width:100%;

height:180px;

object-fit:cover;

}

.related-card div{

padding:18px;

}

@media(max-width:900px){

.product-page{

grid-template-columns:1fr;

}

}

</style>

</head>

<body>

<header>

<div class="container">

<a href="index.html" class="logo">Rezell</a>

<nav>

<a href="index.html">Home</a>

<a href="index.html#products">Products</a>

</nav>

</div>

</header>

<div id="productContainer"></div>

<div class="related">

<h2>Related Products</h2>

<div class="related-grid" id="relatedProducts"></div>

</div>

<script src="products.js"></script>

<script>

const params=new URLSearchParams(window.location.search);

const id=params.get("id");

const product=PRODUCTS.find(p=>p.id===id);

if(product){

document.getElementById("productContainer").innerHTML=`

<div class="product-page">

<div>

<img src="${product.image}" alt="${product.name}">

</div>

<div class="product-info">

<h1>${product.name}</h1>

<div class="rating">

⭐ ${product.rating}/5

</div>

<div class="price">

₹${product.price}

</div>

<div class="stock">

${product.stock}

</div>

<p>

${product.description}

</p>

<h3>Features</h3>

<ul>

${product.features.map(f=>`<li>${f}</li>`).join("")}

</ul>

<h3>Specifications</h3>

<table class="spec-table">

${Object.entries(product.specifications).map(

([key,value])=>`

<tr>

<td><strong>${key}</strong></td>

<td>${value}</td>

</tr>

`

).join("")}

</table>

<div class="buttons">

<button class="buy" onclick="buyNow()">

Buy Now

</button>

<button class="back"

onclick="window.location='index.html'">

Back

</button>

</div>

</div>

</div>

`;

}

function buyNow(){

const subject=encodeURIComponent("Order : "+product.name);

const body=encodeURIComponent(

`Hi Rezell,

I would like to order

${product.name}

Price : ₹${product.price}

Please contact me.

Thank you.`

);

window.location.href=`mailto:${SHOP_EMAIL}?subject=${subject}&body=${body}`;

}

const related=PRODUCTS.filter(

p=>p.category===product.category && p.id!==product.id

).slice(0,4);

document.getElementById("relatedProducts").innerHTML=

related.map(item=>`

<div class="related-card"

onclick="window.location='product.html?id=${item.id}'">

<img src="${item.image}" alt="${item.name}">

<div>

<h3>${item.name}</h3>

<p>₹${item.price}</p>

</div>

</div>

`).join("");

</script>

</body>

</html>
